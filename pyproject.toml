[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nautobot-mcp"
version = "0.1.0"
description = "Read-only Nautobot (network source-of-truth) MCP server for infra/delivery teams."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "mypy>=1.8"]

[project.scripts]
nautobot-mcp = "nautobot_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nautobot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Third-party libs without stubs — don't fail on their internals.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
